name: 🔄 تحديث قنوات الكاس تلقائياً

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-playlist:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 📦 Install dependencies
        run: pip install requests

      - name: 🎬 Generate M3U playlists
        run: python alkass.py

      - name: 📋 Show generated files
        run: |
          echo "=== الملفات المُنشأة ==="
          ls -lh channels/
          echo ""
          echo "=== عدد الملفات ==="
          ls channels/*.m3u | wc -l

      - name: 🚀 Commit and Push
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add channels/
          if git diff --staged --quiet; then
            echo "✅ لا توجد تغييرات"
          else
            git commit -m "🔄 تحديث ملفات القنوات - $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
            echo "✅ تم رفع التحديثات"
          fi
